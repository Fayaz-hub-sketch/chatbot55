<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>History Archive — History Tutor</title>
<style>
:root{--accent:#92400e;--accent2:#d97706;--bg:#f5efe3;--text:#172033;--card:#ffffff;--line:#e5e7eb;--font:Georgia, serif}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
button,input{font:inherit}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr auto;max-width:1180px;margin:auto}
header{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:white;font-weight:900;font-size:19px;box-shadow:0 8px 25px color-mix(in srgb,var(--accent),transparent 72%)}
h1{font-size:16px;margin:0}.sub{font-size:11px;opacity:.6;margin-top:3px}
.status{font-size:11px;padding:7px 10px;border:1px solid var(--line);border-radius:999px}
.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:6px}
.chat{overflow:auto;padding:28px 22px 18px;scroll-behavior:smooth}
.welcome{max-width:720px;margin:5vh auto 28px;text-align:center}
.welcome h2{font-size:clamp(28px,5vw,48px);margin:8px 0 12px;letter-spacing:-1.5px}
.welcome p{opacity:.65;line-height:1.7;margin:0 auto;max-width:600px}
.messages{max-width:820px;margin:auto;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:88%;animation:rise .22s ease}
.msg.user{margin-left:auto;flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:10px;flex:0 0 30px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--accent);color:#fff}
.bubble{padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);line-height:1.65;font-size:14px;white-space:pre-wrap}
.user .bubble{background:var(--accent);color:#fff;border-color:var(--accent)}
.composer{padding:12px 22px 18px;border-top:1px solid var(--line)}
.composer-inner{max-width:820px;margin:auto;display:flex;align-items:end;gap:9px;padding:8px;border:1px solid var(--line);background:var(--card);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.06)}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:inherit;padding:10px 8px;min-height:44px;max-height:140px}
.send{width:42px;height:42px;border:0;border-radius:13px;background:var(--accent);color:#fff;cursor:pointer;font-weight:900}
.send:disabled{opacity:.45;cursor:not-allowed}
.hint{max-width:820px;margin:7px auto 0;text-align:center;font-size:10px;opacity:.45}
@keyframes rise{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:700px){.app{width:100%}.chat{padding:20px 12px}.composer{padding:10px 12px 14px}.msg{max-width:94%}header{padding:14px}.status{display:none}}

.timeline{border-left:2px solid #d6b889;padding-left:14px}.year{font:bold 12px Inter,sans-serif;color:#92400e}.seal{width:42px;height:42px;border:2px solid #92400e;border-radius:50%;display:grid;place-items:center}
body{background:var(--bg)}
.welcome-card{display:inline-block;padding:16px 20px;border:1px solid var(--line);border-radius:20px;background:var(--card);margin-bottom:18px;text-align:left;min-width:min(440px,90vw)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:7px 10px;font-size:11px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo">✦</div>
    <div><h1>History Archive</h1><div class="sub">Focused study tutor · History</div></div>
  </div>
  <div class="status"><i></i> Gemini study mode</div>
</header>

<main class="chat" id="chat">
  <section class="welcome" id="welcome">
    <div class="welcome-card">
      <div class="seal">AD</div><div class="timeline" style="margin-top:10px"><div class="year">TODAY</div></div>
      <h2>History Archive</h2>
      <p>Understand events, causes, consequences, people, and historical context.</p>
      <div class="chips"><button class="chip" data-q="Ancient">Ancient</button><button class="chip" data-q="Modern">Modern</button><button class="chip" data-q="World History">World History</button></div>
    </div>
  </section>
  <div class="messages" id="messages"></div>
</main>

<footer class="composer">
  <div class="composer-inner">
    <textarea id="input" rows="1" placeholder="Ask a history question..." aria-label="Question"></textarea>
    <button class="send" id="send" aria-label="Send">↗</button>
  </div>
  <div class="hint">Questions outside History will be redirected to this study topic.</div>
</footer>
</div>

<script>
const input = document.getElementById("input");
const send = document.getElementById("send");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
let history = [];

function addMessage(role, content) {
  welcome.style.display = "none";
  const row = document.createElement("div");
  row.className = "msg " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "YOU" : "✦";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = content;
  row.appendChild(avatar);
  row.appendChild(bubble);
  messages.appendChild(row);
  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
}

async function ask(text) {
  const question = text.trim();
  if (!question || send.disabled) return;
  addMessage("user", question);
  input.value = "";
  input.style.height = "auto";
  send.disabled = true;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({message: question, history})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");
    addMessage("assistant", data.answer);
    history.push({role:"user", content:question}, {role:"assistant", content:data.answer});
    history = history.slice(-12);
  } catch (err) {
    addMessage("assistant", "Sorry, I couldn't process that question right now. Please try again.");
  } finally {
    send.disabled = false;
    input.focus();
  }
}

send.addEventListener("click", () => ask(input.value));
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    ask(input.value);
  }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});
document.querySelectorAll(".chip").forEach(btn => btn.addEventListener("click", () => {
  input.value = btn.dataset.q + " — explain this topic for studying.";
  input.focus();
}));
</script>
</body>
</html>
